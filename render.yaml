# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stackprep-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # entered in the Render dashboard, never committed
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: EMAILJS_SERVICE_ID
        sync: false # EmailJS (preferred): entered in the Render dashboard
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: MAILJET_API_KEY
        sync: false # Mailjet API key, entered in the Render dashboard
      - key: MAILJET_SECRET_KEY
        sync: false # Mailjet secret key, entered in the Render dashboard
      - key: MAIL_FROM_EMAIL
        sync: false # sender email verified in Mailjet
      - key: MAIL_FROM_NAME
        value: StackPrep
