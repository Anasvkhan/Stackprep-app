# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stackprep-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # entered in the Render dashboard, never committed
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: BREVO_API_KEY
        sync: false # Brevo API key, entered in the Render dashboard
      - key: MAIL_FROM_EMAIL
        sync: false # sender email verified in Brevo
      - key: MAIL_FROM_NAME
        value: StackPrep
