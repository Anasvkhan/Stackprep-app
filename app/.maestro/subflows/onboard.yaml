# Fresh install -> Get started -> sign up -> pick designation -> home.
# Note: Flutter merges a card's texts into one accessibility node ("Title\nSubtitle"),
# so selectors use (?s) regexes that span newlines.
appId: com.stackprep.stackprep
env:
  ROLE: Backend Developer
---
- launchApp:
    clearState: true
- runFlow: dismiss_anr.yaml
- extendedWaitUntil:
    visible: "Get started"
    timeout: 45000
- tapOn: "Get started"
- assertVisible: "(?s).*Create your account.*"
- evalScript: ${output.email = 'maestro' + Date.now() + '@test.com'}
- tapOn: "(?s).*Full name.*"
- inputText: "Maestro Tester"
- tapOn: "(?s).*Email.*"
- inputText: ${output.email}
- tapOn: "(?s).*Password.*"
- inputText: "secret123"
- hideKeyboard
- tapOn: "Create account"
- extendedWaitUntil:
    visible: "What.s your designation.*"
    timeout: 75000
- assertVisible: "(?s).*Welcome, Maestro.*"
- tapOn: "(?s)${ROLE}\n.*"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "(?s).*Quick practice.*"
    timeout: 30000
- runFlow: dismiss_anr.yaml
