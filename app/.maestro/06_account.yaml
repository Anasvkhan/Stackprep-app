appId: com.stackprep.stackprep
name: 06 Log out and log back in, profile is kept
---
- runFlow: subflows/onboard.yaml
- tapOn: "(?s)Profile\nTab.*"
- assertVisible: "(?s).*Maestro Tester.*"
- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
- tapOn: "Log out"
- tapOn: "Log out"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
- tapOn: "I already have an account"
- tapOn: "(?s).*Email.*"
- inputText: ${output.email}
- tapOn: "(?s).*Password.*"
- inputText: "secret123"
- hideKeyboard
- tapOn: "Login"
- extendedWaitUntil:
    visible: "(?s).*Hi, Maestro.*Backend Developer.*"
    timeout: 30000
